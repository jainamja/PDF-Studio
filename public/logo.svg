<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="20" y1="20" x2="52" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="0" y="4" width="64" height="60" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background back page -->
  <rect x="18" y="8" width="36" height="46" rx="6" fill="#1e293b" stroke="#334155" stroke-width="2" />
  <!-- Main Document Page -->
  <rect x="10" y="14" width="38" height="44" rx="6" fill="url(#primaryGrad)" filter="url(#shadow)" />
  <!-- Folded corner/accent shape -->
  <path d="M36 14 L48 26 L36 26 Z" fill="#818cf8" opacity="0.6" />
  <!-- Document Lines / Studio mark -->
  <rect x="16" y="24" width="16" height="3" rx="1.5" fill="#ffffff" opacity="0.9" />
  <rect x="16" y="31" width="26" height="3" rx="1.5" fill="#ffffff" opacity="0.75" />
  <rect x="16" y="38" width="22" height="3" rx="1.5" fill="#ffffff" opacity="0.75" />
  <!-- Studio Pen / Stylus Accent -->
  <circle cx="44" cy="42" r="10" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="2.5" />
  <path d="M41 45 L47 39 M42 47 L40 45 L42 41 L47 46 Z" fill="url(#accentGrad)" stroke="url(#accentGrad)" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
